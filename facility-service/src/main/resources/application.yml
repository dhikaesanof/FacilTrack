server:
  shutdown: graceful
  port: 8082

spring:
  application:
    name: facility-service
  datasource:
    url: jdbc:h2:file:${FACILITY_DB_DIR:./data/facility}/facility_db
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method

logging:
  level:
    com.campus.facility: INFO
