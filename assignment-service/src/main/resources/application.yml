server:
  shutdown: graceful
  port: 8083

spring:
  application:
    name: assignment-service
  datasource:
    url: jdbc:h2:file:${ASSIGNMENT_DB_DIR:./data/assignment}/assignment_db
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

services:
  report-service:
    url: ${REPORT_SERVICE_URL:http://localhost:8081}
    connect-timeout-ms: 3000
    read-timeout-ms: 3000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method

logging:
  level:
    com.campus.assignment: INFO
